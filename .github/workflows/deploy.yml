name: Deploy to GitHub Pages (disabled)

# The dashboard now runs on Vercel, where it requires a login and reads from a
# shared database. This Pages build has neither — it would publish an
# unauthenticated copy of real P&L data to a public URL. Auto-deploy is
# therefore off; the job is kept only so it can be run deliberately if the
# Pages deployment is ever needed again.
on:
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
