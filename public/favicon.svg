<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="Hivefy Lifestyle">
  <!--
    The tab mark: a capital H on the accent tile, as the owner drew it.

    It carries its own background on purpose. A glyph alone would be drawn in
    whatever colour the browser's tab strip happens to be, and disappear on
    half of them; a tile is legible at 16px on a light strip and a dark one,
    which is the whole job of a favicon.

    The H is a path rather than text, because a favicon is rendered where no
    stylesheet and no web font have loaded, and <text> would be set in
    whatever the browser falls back to — a different letter on every machine.
  -->
  <rect width="64" height="64" rx="18" ry="18" fill="#3b5bdb"/>
  <path d="M19 18h7v10.5h12V18h7v28h-7V35.5H26V46h-7z" fill="#ffffff"/>
</svg>
